# Mobile release builds.
#
# - android: Play-ready App Bundle (AAB). Signed with the upload key when the
#   ANDROID_UPLOAD_* secrets exist; otherwise built unsigned with a warning.
# - ios: compiles the app for devices with Xcode, unsigned
#   (CODE_SIGNING_ALLOWED=NO). Proves the native project builds; signing,
#   archiving and App Store upload still need the owner's Apple account.
#
# Runs on pushes that touch the app, version tags (v*), and manually. Secrets
# are only read on pushes/tags/manual runs in this repository, never on pull
# requests, so forks cannot reach them.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   PRODUCTION_API_URL   public HTTPS API origin compiled into the apps (required
#                        for a store build; a CI placeholder is used otherwise)
#   PUBLIC_WEB_URL       public web address for shared verse links (optional)
#   PRIVACY_CONTACT      privacy contact e-mail shown on /privacy (optional)
# Repository secrets (Android signing):
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
#   ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD

name: Mobile release

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.ci-placeholder.invalid' }}
  VITE_PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
  VITE_PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - name: Store build needs the production API URL
        if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_API_URL == ''
        run: |
          echo "::error::Set the PRODUCTION_API_URL repository variable before tagging a release."
          exit 1
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Upload key (from secrets, if configured)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "store_file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_UPLOAD_* secrets not set: building an UNSIGNED bundle (not uploadable to Play)."
          fi
      - name: Build release bundle
        env:
          TADABBUR_UPLOAD_STORE_FILE: ${{ steps.key.outputs.store_file }}
          TADABBUR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          TADABBUR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          TADABBUR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew bundleRelease --no-daemon
          ls -l app/build/outputs/bundle/release/
      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tadabbur-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios:
    name: iOS device build (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Xcode build for devices, without signing
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          ls "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/"
      - name: Bundle contains the privacy manifest and Arabic name
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/ar.lproj/InfoPlist.strings"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|NSLocationWhenInUseUsageDescription|ITSAppUsesNonExemptEncryption"

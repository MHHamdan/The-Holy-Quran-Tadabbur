[project]
name = "tadabbur-ai"
version = "0.1.0"
description = "RAG-grounded Quranic knowledge platform with story connections"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    # <0.137: 0.137 nests included routers (_IncludedRouter), hiding route paths
    # from app.routes, which the route-registration tests and contract checks read.
    "fastapi>=0.109.0,<0.137",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    # [asyncio] pulls greenlet, required by the async engine. <2.1: 2.1 switches the
    # default postgresql:// driver to psycopg 3, which breaks tuple IN binds in seeds.
    "sqlalchemy[asyncio]>=2.0.25,<2.1",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Vector Database
    "qdrant-client>=1.7.0",

    # Cache & Queue
    "redis>=5.0.0",
    "rq>=1.16.0",

    # AI/ML
    "anthropic>=0.18.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.1.0",

    # Data Processing
    "httpx>=0.26.0",
    "aiohttp>=3.13.4",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.1",

    # Utilities
    "python-dotenv>=1.2.2",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
stt = [
    "faster-whisper>=0.10.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

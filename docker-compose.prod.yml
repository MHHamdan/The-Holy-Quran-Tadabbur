# Tadabbur-AI Docker Compose - Production Configuration
# Use: docker compose -f docker-compose.prod.yml up --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: tadabbur-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tadabbur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-tadabbur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tadabbur}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tadabbur-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: tadabbur-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes

  surrealdb:
    image: surrealdb/surrealdb:v1.5.0
    container_name: tadabbur-surrealdb
    user: root
    command: start --log info --user ${SURREAL_USER:-tadabbur} --pass ${SURREAL_PASS:?SURREAL_PASS must be set} memory
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: tadabbur-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tadabbur}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-tadabbur}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      # Hugging Face Inference Providers — the only AI platform. HF_TOKEN is a
      # server-side secret: supply it from the host environment / secret store.
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN must be set on the host}
      - HF_LLM_MODEL=${HF_LLM_MODEL:-meta-llama/Llama-3.3-70B-Instruct}
      - HF_LLM_PROVIDER=${HF_LLM_PROVIDER:-auto}
      - HF_EMBEDDING_MODEL=${HF_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      - HF_RERANKER_MODEL=${HF_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - HF_STT_MODEL=${HF_STT_MODEL:-openai/whisper-large-v3-turbo}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      - KG_ADMIN_TOKEN=${KG_ADMIN_TOKEN:?KG_ADMIN_TOKEN must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must list the web and app origins}
      - SURREAL_HOST=surrealdb
      - SURREAL_PORT=8000
      - SURREAL_USER=${SURREAL_USER:-tadabbur}
      - SURREAL_PASS=${SURREAL_PASS:?SURREAL_PASS must be set}
      - SURREAL_NAMESPACE=tadabbur
      - SURREAL_DATABASE=quran_kg
      - WORKERS=4
      - FEATURE_REDIS_CACHE=true
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: tadabbur-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

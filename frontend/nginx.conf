worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Serve build-time precompressed *.gz when the client accepts it — zero
    # per-request CPU, best ratio (vite emits level-9 gzip). Falls back to
    # on-the-fly gzip below for anything without a precompressed sibling
    # (e.g. proxied API responses).
    gzip_static on;

    # On-the-fly gzip fallback
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml application/manifest+json application/wasm;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API proxy to backend
        location ^~ /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Service worker and manifest: always revalidate, otherwise clients
        # keep running an old build after a deploy (PWA update flow).
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Content-hashed build output (assets/js/*-[hash].js, workbox-[hash].js):
        # safe to cache forever.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }
        location ~ ^/workbox-[0-9a-f]+\.js$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Unhashed static files (icons, favicon, static JSON data): cache
        # briefly, they can change between deploys under the same name.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            add_header Cache-Control "public, max-age=86400";
            access_log off;
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

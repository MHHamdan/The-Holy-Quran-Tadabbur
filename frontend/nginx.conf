worker_processes auto;
# Runs as the unprivileged nginx user: pid and temp files live in /tmp.
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No client IP, user or query string in access logs (see the in-app
    # privacy policy): $uri has no arguments, unlike $request, which carried
    # search text (?q=...). The referer is dropped for the same reason.
    log_format main '[$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Client address. Only the optional TLS proxy (the `caddy` service of
    # docker-compose.prod.yml, fixed at 172.28.0.10 on the compose network) is
    # trusted to report the real client in X-Forwarded-For; anything a client
    # sends itself is ignored.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Edge rate limit for the API (per client address, shared by all backend
    # workers). The backend applies stricter per-route limits on top.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # Scheme the client used: from the trusted TLS proxy when present.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server_tokens off;
    # Tasmee recordings are uploaded through /api.
    client_max_body_size 25m;

    # WebSocket upgrade only when the client asks for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Serve build-time precompressed *.gz when the client accepts it — zero
    # per-request CPU, best ratio (vite emits level-9 gzip). Falls back to
    # on-the-fly gzip below for anything without a precompressed sibling
    # (e.g. proxied API responses).
    gzip_static on;

    # On-the-fly gzip fallback
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml application/manifest+json application/wasm;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/snippets/security-headers.conf;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            default_type text/plain;
        }

        # API proxy to the backend service (Docker DNS name, not an IP).
        location ^~ /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            limit_req zone=api burst=40 nodelay;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (never append to) the client's header: the backend
            # trusts exactly one hop, this one.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Service worker and manifest: always revalidate, otherwise clients
        # keep running an old build after a deploy (PWA update flow).
        location = /sw.js {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        # Content-hashed build output (assets/js/*-[hash].js, workbox-[hash].js):
        # safe to cache forever.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
            try_files $uri =404;
        }
        location ~ ^/workbox-[0-9a-f]+\.js$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
        }

        # Unhashed static files (icons, favicon, static JSON data): cache
        # briefly, they can change between deploys under the same name.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            add_header Cache-Control "public, max-age=86400";
            include /etc/nginx/snippets/security-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}

# Included in every location that sets its own add_header (nginx does not
# inherit add_header into such locations).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers honour HSTS only over HTTPS (the TLS proxy in front of this
# container); it is ignored on plain-HTTP responses.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content-Security-Policy. Hosts: the third-party services named on the
# privacy page (recitation CDNs, prayer times, maps, news, zakat prices,
# books) plus Google Fonts. Keep in sync with frontend/src/pages/PrivacyPage.tsx.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://everyayah.com https://cdn.islamic.network https://quranicaudio.com https://*.quranicaudio.com https://verses.quran.com https://archive.org https://*.archive.org; connect-src 'self' https://api.aladhan.com https://nominatim.openstreetmap.org https://overpass-api.de https://api.rss2json.com https://www.goldapi.io https://freegoldapi.com https://archive.org https://*.archive.org https://everyayah.com https://cdn.islamic.network https://quranicaudio.com https://*.quranicaudio.com https://verses.quran.com https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
